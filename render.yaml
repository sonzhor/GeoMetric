# Render Blueprint — бесплатный Web Service
# https://render.com : New → Blueprint → этот репозиторий

services:
  - type: web
    name: geo-intelligence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
